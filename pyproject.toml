[project]
name = "agyloop"
version = "0.1.0"
description = "Long-running agent loops on agy CLI across several Google accounts"
requires-python = ">=3.11"

[project.scripts]
agyloop = "agyloop.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agyloop"]
