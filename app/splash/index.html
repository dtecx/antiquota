<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>antiquota</title>
<style>
  :root {
    --night: #0e0f11; --night-1: #141518; --ink: #e8e6e1; --ink-2: #b3b0a9; --ink-3: #85827b; --ink-4: #5b5954;
    --rule-2: rgba(255, 255, 255, .1); --baton: #e8a33d; --bad: #e2715f;
    --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--night); color: var(--ink); font: 14px/1.5 var(--sans); }
  body { display: grid; place-items: center; -webkit-user-select: none; user-select: none; }
  main { width: min(520px, calc(100vw - 48px)); text-align: center; }
  .mark { display: inline-flex; gap: 6px; margin-bottom: 22px; }
  .mark i { display: block; width: 34px; height: 14px; border-radius: 7px; background: var(--ink-3); }
  .mark i:first-child { background: var(--baton); animation: pass 1.4s cubic-bezier(.4, 0, .2, 1) infinite; }
  .mark i:last-child { animation: take 1.4s cubic-bezier(.4, 0, .2, 1) infinite; }
  @keyframes pass { 50% { transform: translateX(4px); } }
  @keyframes take { 50% { background: var(--ink-2); } }
  .error .mark i { animation: none; }
  h1 { margin: 0 0 6px; font: 600 15px var(--mono); letter-spacing: -.02em; }
  #text { margin: 0; color: var(--ink-3); white-space: pre-wrap; }
  .error #text { color: var(--ink-2); text-align: left; font: 12px/1.6 var(--mono); max-height: 50vh; overflow: auto;
    padding: 12px 14px; border: 1px solid var(--rule-2); border-radius: 10px; background: var(--night-1); -webkit-user-select: text; user-select: text; }
  .acts { display: none; gap: 8px; justify-content: center; margin-top: 18px; }
  .error .acts { display: flex; }
  button { height: 32px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--rule-2); background: none; color: var(--ink);
    font: 500 13px var(--sans); cursor: pointer; }
  button.primary { background: var(--baton); border-color: var(--baton); color: #1a1206; }
  button:focus-visible { outline: 2px solid var(--baton); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .mark i { animation: none !important; } }
</style>
</head>
<body>
<main id="main">
  <div class="mark" aria-hidden="true"><i></i><i></i></div>
  <h1>antiquota</h1>
  <p id="text" role="status">Starting the antiquota engine…</p>
  <div class="acts">
    <button class="primary" id="retry">Try again</button>
    <button id="quit">Quit</button>
  </div>
</main>
<script>
  const T = window.__TAURI__;
  const main = document.getElementById('main'), text = document.getElementById('text');
  T.event.listen('engine-status', e => {
    text.textContent = e.payload.text;
    main.classList.toggle('error', !!e.payload.error);
  }).then(() => T.core.invoke('retry_engine')).catch(error => {
    text.textContent = String(error);
    main.classList.add('error');
  });
  document.getElementById('retry').onclick = () => {
    main.classList.remove('error');
    text.textContent = 'Starting the antiquota engine…';
    T.core.invoke('retry_engine');
  };
  document.getElementById('quit').onclick = () => T.core.invoke('quit_app');
</script>
</body>
</html>
