[package]
name = "antiquota-desktop"
version = "0.5.0"
description = "antiquota desktop app"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "antiquota_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "=2.5.1"
tauri-plugin-single-instance = "=2.5.2"
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-opener = "=2.7.0"
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-clipboard-manager = "=2.4.1"
tauri-plugin-autostart = "=2.7.0"
serde.workspace = true
serde_json.workspace = true
ureq = "=3.4.2"
antiquota-store.workspace = true
chrono.workspace = true

[lints]
workspace = true
