[package]
name = "antiquota-app"
version = "0.5.0"
description = "antiquota desktop app"
edition = "2021"
publish = false

[lib]
name = "antiquota_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2.5"
tauri-plugin-single-instance = "2.5"
tauri-plugin-window-state = "2.5"
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-clipboard-manager = "2.4"
tauri-plugin-autostart = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
